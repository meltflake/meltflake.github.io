<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#fdfcf9;
  --hero-bg:#f8f6f1;
  --card1:#f3f1ec;--card2:#f0eee9;--card3:#edebe6;
  --text:#3c3730;--sub:#a09888;--light:#c8c0b4;
  --border:#ece9e3;
}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* Nav */
nav{display:flex;align-items:center;justify-content:space-between;padding:1.2rem 2.5rem;max-width:1200px;margin:0 auto}
.nav-logo{font-size:1.3rem;font-weight:700;letter-spacing:-0.5px;color:var(--text)}
.nav-links{display:flex;gap:2rem;align-items:center}
.nav-links a{font-size:.82rem;color:var(--sub);text-decoration:none;transition:color .2s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--bg);background:var(--text);padding:.35rem .9rem;border-radius:3px;font-size:.78rem}
.nav-hamburger{display:none;font-size:1.2rem;cursor:pointer;color:var(--text)}

/* Hero */
.hero{background:var(--hero-bg);padding:5rem 2.5rem 4.5rem;position:relative;overflow:hidden}
.hero-inner{max-width:1200px;margin:0 auto;text-align:center}
.hero-brand{font-size:1rem;font-weight:700;color:var(--light);letter-spacing:2px;margin-bottom:1rem}
.hero-line{width:60px;height:1px;background:var(--light);margin:0 auto 2rem}
.hero-title{font-size:clamp(1.8rem,4.5vw,2.8rem);font-weight:700;line-height:1.3;margin-bottom:1.2rem;color:var(--text)}
.hero-sub{font-size:clamp(.9rem,2vw,1.1rem);color:var(--sub);letter-spacing:3px}

/* Filter */
.filter{max-width:1200px;margin:0 auto;padding:2.5rem 2.5rem 0;display:flex;gap:1.5rem}
.filter-tab{font-size:.82rem;color:var(--sub);cursor:pointer;padding-bottom:.4rem;border-bottom:2px solid transparent;transition:all .2s}
.filter-tab.active{color:var(--text);border-bottom-color:var(--text);font-weight:600}

/* Masonry Grid */
.grid{max-width:1200px;margin:0 auto;padding:1.5rem 2.5rem;display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.grid-item{border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:var(--text);transition:all .35s ease;cursor:pointer;position:relative;overflow:hidden}
.grid-item:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.06)}
.grid-item .item-name{font-size:1.15rem;font-weight:700;margin-bottom:.3rem}
.grid-item .item-en{font-size:.68rem;color:var(--light);margin-bottom:.5rem;letter-spacing:.5px}
.grid-item .item-desc{font-size:.75rem;color:var(--sub);line-height:1.6}
.grid-item .item-arrow{position:absolute;top:1rem;right:1.2rem;font-size:.9rem;color:var(--light);transition:color .2s}
.grid-item:hover .item-arrow{color:var(--text)}

/* Item sizes */
.item-tall{grid-row:span 2;padding:3rem 2rem;min-height:340px;background:var(--card1);align-items:flex-start;justify-content:center}
.item-short{padding:2rem 2rem;min-height:160px;align-items:flex-start;justify-content:center}
.item-r1{background:var(--card2)}
.item-r2{background:var(--card3)}
.item-full{grid-column:span 2;padding:2rem 1.5rem;min-height:120px;background:var(--border);flex-direction:row;gap:2rem}
.item-full .item-emoji{font-size:2rem;margin-bottom:0}

/* Coming soon */
.item-ghost{background:rgba(0,0,0,.015);padding:2rem 1.5rem;min-height:120px}
.item-ghost .item-emoji{opacity:.4}
.item-ghost .item-name{color:var(--light);font-size:.85rem}

/* View More */
.more{text-align:center;padding:2.5rem 0;max-width:1200px;margin:0 auto}
.more a{font-size:.82rem;color:var(--text);text-decoration:none;border-bottom:1px solid var(--text);padding-bottom:.2rem;transition:opacity .2s}
.more a:hover{opacity:.6}

/* Footer */
footer{border-top:1px solid var(--border);max-width:1200px;margin:2rem auto 0;padding:2rem 2.5rem;display:flex;justify-content:space-between;align-items:center}
.footer-logo{font-size:1.1rem;font-weight:700;color:var(--text)}
.footer-copy{font-size:.7rem;color:var(--light)}

/* Mobile */
@media(max-width:768px){
  nav{padding:1rem 1.2rem}
  .nav-links{display:none}
  .nav-hamburger{display:block}
  .nav-links.open{display:flex;flex-direction:column;position:absolute;top:3.5rem;right:1.2rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:1rem 1.5rem;gap:1rem;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.08)}
  nav{position:relative}
  .hero{padding:3rem 1.2rem 2.5rem}
  .filter{padding:1.5rem 1.2rem 0}
  .grid{padding:1rem 1.2rem;gap:.4rem}
  .item-tall{min-height:280px;padding:2rem 1rem}
  .item-short{min-height:130px;padding:1.5rem 1rem}
  .item-full{flex-direction:column;gap:1rem;min-height:100px}
  footer{flex-direction:column;gap:.8rem;text-align:center;padding:1.5rem 1.2rem}
}

/* Animation */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.grid-item{animation:fadeUp .5s ease both}
.grid-item:nth-child(1){animation-delay:.1s}
.grid-item:nth-child(2){animation-delay:.2s}
.grid-item:nth-child(3){animation-delay:.3s}
.grid-item:nth-child(4){animation-delay:.4s}
.grid-item:nth-child(5){animation-delay:.5s}
</style>
</head>
