<!DOCTYPE html>
<html lang="$lang$">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>$title$</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      background-color: #f5f0e8;
    }

    body {
      font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", Georgia, "Times New Roman", serif;
      color: #2c2c2c;
      background-color: #f5f0e8;
      line-height: 1.9;
      font-size: 17px;
      padding: 3em 1.5em;
      max-width: 42em;
      margin: 0 auto;
      text-rendering: optimizeLegibility;
      font-kerning: normal;
      -webkit-font-smoothing: antialiased;
    }

    h1 {
      font-size: 1.8em;
      font-weight: 700;
      margin-bottom: 0.3em;
      letter-spacing: 0.05em;
    }

    h2 {
      font-size: 1.3em;
      font-weight: 600;
      margin-top: 2em;
      margin-bottom: 0.5em;
    }

    p {
      margin: 1em 0;
      text-align: justify;
    }

    em {
      font-style: italic;
      color: #555;
    }

    hr {
      border: none;
      border-top: 1px solid #d4cbb8;
      margin: 2.5em 0;
    }

    blockquote {
      border-left: 3px solid #c4b89c;
      padding-left: 1em;
      margin: 1.5em 0;
      color: #666;
    }

    a {
      color: #2c2c2c;
      text-decoration: underline;
      text-decoration-color: #c4b89c;
      text-underline-offset: 3px;
    }

    a:hover {
      text-decoration-color: #2c2c2c;
    }

    code {
      font-family: "SF Mono", "Fira Code", "Consolas", monospace;
      font-size: 0.88em;
      background: rgba(0,0,0,0.05);
      padding: 0.15em 0.4em;
      border-radius: 3px;
    }

    pre {
      background: rgba(0,0,0,0.04);
      padding: 1em;
      border-radius: 4px;
      overflow-x: auto;
      margin: 1.5em 0;
      line-height: 1.5;
    }

    pre code {
      background: none;
      padding: 0;
    }

    @media (max-width: 600px) {
      body {
        font-size: 16px;
        padding: 1.5em 1em;
        line-height: 1.8;
      }
      h1 {
        font-size: 1.5em;
      }
    }

    @media print {
      html, body {
        background-color: white;
        color: black;
      }
    }
  </style>
</head>
<body>
<h1>$title$</h1>
$body$
</body>
</html>
